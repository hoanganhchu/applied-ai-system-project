<svg width="100%" viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Applied AI Music Recommender - System Architecture</title>
<desc>Minimal architecture diagram showing input, agent steps, retrieval, scoring, output, and evaluation.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1 L9 5 L1 9" fill="#111"/>
  </marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .title { font-size: 16px; font-weight: 700; }
    .label { font-size: 13px; font-weight: 600; }
    .sub { font-size: 12px; fill: #333; }
    .box { fill: #fff; stroke: #111; stroke-width: 1.4; rx: 8; }
    .soft { fill: #fafafa; stroke: #111; stroke-width: 1.2; rx: 8; }
    .line { stroke: #111; stroke-width: 1.4; fill: none; }
    .dash { stroke-dasharray: 5 4; }
  </style>
</defs>

<text class="title" x="380" y="28" text-anchor="middle">Applied AI Music Recommender - System Architecture</text>

<!-- Main flow -->
<rect class="box" x="40" y="90" width="150" height="62"/>
<text class="label" x="115" y="116" text-anchor="middle">User Profile</text>
<text class="sub" x="115" y="134" text-anchor="middle">genre, mood, energy, valence</text>

<rect class="box" x="230" y="90" width="150" height="62"/>
<text class="label" x="305" y="116" text-anchor="middle">Agent: PLAN</text>
<text class="sub" x="305" y="134" text-anchor="middle">set retrieval strategy</text>

<rect class="box" x="420" y="90" width="150" height="62"/>
<text class="label" x="495" y="116" text-anchor="middle">Retriever</text>
<text class="sub" x="495" y="134" text-anchor="middle">candidate filtering (RAG)</text>

<rect class="box" x="610" y="90" width="110" height="62"/>
<text class="label" x="665" y="116" text-anchor="middle">Scorer</text>
<text class="sub" x="665" y="134" text-anchor="middle">rank + confidence</text>

<line class="line" x1="190" y1="121" x2="230" y2="121" marker-end="url(#arrow)"/>
<line class="line" x1="380" y1="121" x2="420" y2="121" marker-end="url(#arrow)"/>
<line class="line" x1="570" y1="121" x2="610" y2="121" marker-end="url(#arrow)"/>

<!-- Reflect + output -->
<rect class="box" x="260" y="220" width="170" height="62"/>
<text class="label" x="345" y="246" text-anchor="middle">Agent: REFLECT</text>
<text class="sub" x="345" y="264" text-anchor="middle">quality check (threshold)</text>

<rect class="box" x="500" y="220" width="190" height="62"/>
<text class="label" x="595" y="246" text-anchor="middle">Top-K Recommendations</text>
<text class="sub" x="595" y="264" text-anchor="middle">title, score, confidence, reason</text>

<line class="line" x1="665" y1="152" x2="665" y2="200"/>
<line class="line" x1="665" y1="200" x2="430" y2="200" marker-end="url(#arrow)"/>
<line class="line" x1="430" y1="251" x2="500" y2="251" marker-end="url(#arrow)"/>

<!-- Retry path -->
<path class="line dash" d="M300 220 C250 180, 240 150, 265 140" marker-end="url(#arrow)"/>
<text class="sub" x="195" y="193">retry with relaxed filters</text>

<!-- Side components -->
<rect class="soft" x="40" y="320" width="210" height="56"/>
<text class="label" x="145" y="344" text-anchor="middle">Test Harness</text>
<text class="sub" x="145" y="362" text-anchor="middle">predefined cases + pass/fail</text>

<rect class="soft" x="285" y="320" width="180" height="56"/>
<text class="label" x="375" y="344" text-anchor="middle">Catalog</text>
<text class="sub" x="375" y="362" text-anchor="middle">data/songs.csv</text>

<rect class="soft" x="500" y="320" width="180" height="56"/>
<text class="label" x="590" y="344" text-anchor="middle">Logging</text>
<text class="sub" x="590" y="362" text-anchor="middle">recommender.log</text>

<line class="line" x1="375" y1="320" x2="495" y2="152" marker-end="url(#arrow)"/>
<line class="line" x1="145" y1="320" x2="310" y2="282" marker-end="url(#arrow)"/>
<line class="line" x1="590" y1="320" x2="595" y2="282" marker-end="url(#arrow)"/>
</svg>
